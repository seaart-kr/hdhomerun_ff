name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install route test dependencies
        run: python -m pip install Flask==3.1.3
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
